<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="The Mia Code agent loop: understand, gather context, act, verify, report">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#5CE1E6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="route" d="M100 130 H900 C965 130 965 255 900 255 H100 C35 255 35 130 100 130 Z"/>
  </defs>
  <style>
    text{font-family:'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .node rect{fill:#0F0B20;stroke:#9B7BFF;stroke-opacity:.45;stroke-width:1.5;animation:lit 10s infinite}
    @keyframes lit{0%{stroke:#5CE1E6;stroke-opacity:1;fill:#1A1235}9%{stroke:#5CE1E6;stroke-opacity:1;fill:#1A1235}14%{stroke:#9B7BFF;stroke-opacity:.45;fill:#0F0B20}100%{stroke:#9B7BFF;stroke-opacity:.45;fill:#0F0B20}}
    .t1{fill:#fff;font-size:15px;font-weight:700;letter-spacing:2px}
    .t2{fill:#8C97AD;font-size:12px}
  </style>

  <rect x="1" y="1" width="998" height="328" rx="16" fill="#0A0814" stroke="#9B7BFF" stroke-opacity="0.25"/>

  <!-- loop track -->
  <use href="#route" fill="none" stroke="#9B7BFF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3 9"/>
  <use href="#route" fill="none" stroke="url(#ac)" stroke-width="2" stroke-opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"/>
  </use>

  <!-- nodes -->
  <g class="node" text-anchor="middle">
    <rect x="25" y="95" width="150" height="70" rx="12" style="animation-delay:0s"/>
    <text x="100" y="125" class="t1">UNDERSTAND</text><text x="100" y="147" class="t2">read the task</text>
    <rect x="225" y="95" width="150" height="70" rx="12" style="animation-delay:1s"/>
    <text x="300" y="125" class="t1">CONTEXT</text><text x="300" y="147" class="t2">select relevant files</text>
    <rect x="425" y="95" width="150" height="70" rx="12" style="animation-delay:2s"/>
    <text x="500" y="125" class="t1">ACT</text><text x="500" y="147" class="t2">permitted tools only</text>
    <rect x="625" y="95" width="150" height="70" rx="12" style="animation-delay:3s"/>
    <text x="700" y="125" class="t1">VERIFY</text><text x="700" y="147" class="t2">tests · checks · diffs</text>
    <rect x="825" y="95" width="150" height="70" rx="12" style="animation-delay:4s"/>
    <text x="900" y="125" class="t1">REPORT</text><text x="900" y="147" class="t2">evidence, not claims</text>
  </g>

  <!-- traveling pulse -->
  <circle r="7" fill="#5CE1E6" filter="url(#glow)">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"><mpath href="#route"/></animateMotion>
  </circle>

  <text x="500" y="210" text-anchor="middle" font-size="12" fill="#7C879C" letter-spacing="3">NEEDS MORE WORK? LOOP BACK</text>
  <text x="500" y="283" text-anchor="middle" font-size="13" fill="#B9C3D6" letter-spacing="2">BOUNDED BY ITERATION  ·  TIME  ·  TOKEN LIMITS</text>
  <text x="500" y="308" text-anchor="middle" font-size="11" fill="#596579">stops when the task is complete, a limit is reached, or human input is required</text>
</svg>
