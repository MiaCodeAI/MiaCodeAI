<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Mia Code roadmap: seven phases from Foundation to Advanced Features">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#5CE1E6"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text{font-family:'SF Mono','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;text-anchor:middle}
    .n{font-size:20px;font-weight:700;fill:#596579}
    .a .n{fill:#5CE1E6}
    .t{font-size:13px;fill:#D8DFEA}
    .s{font-size:10px;letter-spacing:2px;fill:#596579}
    .a .s{fill:#5CE1E6}
    .ring{animation:ring 2.4s ease-out infinite;transform-origin:70px 100px;transform-box:view-box}
    @keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
  </style>

  <rect x="1" y="1" width="998" height="258" rx="16" fill="#0A0814" stroke="#9B7BFF" stroke-opacity="0.25"/>

  <!-- track -->
  <path d="M70 100H930" stroke="#596579" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
  <!-- progress (Phase 1 in progress) -->
  <path d="M70 100H140" stroke="url(#ac)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="d" values="M70 100H100;M70 100H150;M70 100H100" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- nodes -->
  <g fill="#0A0814" stroke="#596579" stroke-width="2">
    <circle cx="213" cy="100" r="10"/><circle cx="356" cy="100" r="10"/><circle cx="500" cy="100" r="10"/>
    <circle cx="643" cy="100" r="10"/><circle cx="787" cy="100" r="10"/><circle cx="930" cy="100" r="10"/>
  </g>
  <circle cx="70" cy="100" r="12" fill="#0A0814" stroke="#5CE1E6" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="70" cy="100" r="5" fill="#5CE1E6"/>
  <circle cx="70" cy="100" r="12" fill="none" stroke="#5CE1E6" stroke-width="2" class="ring"/>

  <!-- labels -->
  <g class="a">
    <text x="70" y="150" class="n">01</text>
    <text x="70" y="176" class="t">Foundation</text>
    <text x="70" y="212" class="s">IN PROGRESS</text>
  </g>
  <g>
    <text x="213" y="150" class="n">02</text><text x="213" y="176" class="t">Project</text><text x="213" y="194" class="t">Intelligence</text><text x="213" y="228" class="s">PLANNED</text>
    <text x="356" y="150" class="n">03</text><text x="356" y="176" class="t">Coding</text><text x="356" y="194" class="t">Agent</text><text x="356" y="228" class="s">PLANNED</text>
    <text x="500" y="150" class="n">04</text><text x="500" y="176" class="t">Large</text><text x="500" y="194" class="t">Projects</text><text x="500" y="228" class="s">PLANNED</text>
    <text x="643" y="150" class="n">05</text><text x="643" y="176" class="t">Multi-</text><text x="643" y="194" class="t">Provider</text><text x="643" y="228" class="s">PLANNED</text>
    <text x="787" y="150" class="n">06</text><text x="787" y="176" class="t">Public</text><text x="787" y="194" class="t">Release</text><text x="787" y="228" class="s">PLANNED</text>
    <text x="930" y="150" class="n">07</text><text x="930" y="176" class="t">Advanced</text><text x="930" y="194" class="t">Features</text><text x="930" y="228" class="s">FUTURE</text>
  </g>
  <text x="500" y="52" style="font-size:12px;letter-spacing:4px;fill:#8C97AD">DEVELOPMENT SEQUENCE  —  NOT A COMPLETION CLAIM</text>
</svg>
